# Временная диагностика: показывает, к какому YouTube-каналу подключены секреты.
# Только чтение (channels.list), квоты почти не тратит. Удалить после проверки.
name: yt-diag
on:
  push:
    paths:
      - '.github/workflows/diag.yml'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Какой канал у токена
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          data = urllib.parse.urlencode({
              "client_id": os.environ["YT_CLIENT_ID"],
              "client_secret": os.environ["YT_CLIENT_SECRET"],
              "refresh_token": os.environ["YT_REFRESH_TOKEN"],
              "grant_type": "refresh_token",
          }).encode()
          tok = json.loads(urllib.request.urlopen(
              urllib.request.Request("https://oauth2.googleapis.com/token",
                                     data=data, method="POST"), timeout=60).read())["access_token"]
          req = urllib.request.Request(
              "https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&mine=true",
              headers={"Authorization": f"Bearer {tok}"})
          items = json.loads(urllib.request.urlopen(req, timeout=60).read()).get("items", [])
          if not items:
              print("NO CHANNEL: у этого токена нет канала YouTube")
          else:
              ch = items[0]
              print("CHANNEL_TITLE:", ch["snippet"]["title"])
              print("CHANNEL_ID:", ch["id"])
              print("CUSTOM_URL:", ch["snippet"].get("customUrl", ""))
              print("STATS:", json.dumps(ch.get("statistics", {}), ensure_ascii=False))
          PY
