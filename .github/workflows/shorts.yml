name: shorts-factory

on:
  schedule:
    # ВРЕМЕННО 4 слота: 15 Nov два Extra-выпуска из catchup.yml (слоты 5,6),
    # чтобы не превысить дневную квоту API (6×1600=9600 из 10000).
    # С 16 Nov вернуть: cron: "0 10,12,14,16,18 * * *"
    # Слоты сдвинуты на после сброса дневного лимита загрузок (~08:00 UTC / 11:00 МСК).
    - cron: "0 10,12,14,16 * * *"
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "Dockerfile"
      - ".github/workflows/shorts.yml"
  workflow_dispatch:
    inputs:
      era:
        description: "Эпоха (пусто = случайная)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t shorts-factory .

      - name: Генерация шортса
        env:
          ERA: ${{ github.event_name == 'workflow_dispatch' && inputs.era || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          mkdir -p output
          ARGS=""
          if [ -n "$ERA" ]; then ARGS="$ERA"; fi
          HOUR=$(date -u +%H)
          case $HOUR in
            10|11) SLOT=0;;
            12|13) SLOT=1;;
            14|15) SLOT=2;;
            16|17) SLOT=3;;
            *) SLOT=4;;
          esac
          export SHORTS_SLOT=$SLOT
          MOUNTS=""
          if [ -f patches/script_gen.py ]; then
            MOUNTS="$MOUNTS -v $PWD/patches/script_gen.py:/app/shorts_factory/script_gen.py"
          fi
          if [ -f patches/images.py ]; then
            MOUNTS="$MOUNTS -v $PWD/patches/images.py:/app/shorts_factory/images.py"
          fi
          if [ -f patches/tts.py ]; then
            MOUNTS="$MOUNTS -v $PWD/patches/tts.py:/app/shorts_factory/tts.py"
          fi
          if [ -f patches/video.py ]; then
            MOUNTS="$MOUNTS -v $PWD/patches/video.py:/app/shorts_factory/video.py"
          fi
          docker run --rm -v "$PWD/output:/app/output" $MOUNTS \
            -e GEMINI_API_KEY -e POLLINATIONS_TOKEN -e SHORTS_SLOT             -e YT_CLIENT_ID -e YT_CLIENT_SECRET -e YT_REFRESH_TOKEN \
            shorts-factory python -m shorts_factory.pipeline /app/output $ARGS
        shell: bash

      - name: Публикация на YouTube (если ключи настроены)
        # На push-сборках (валидация) не публикуем — чтобы не расходовать
        # дневной лимит загрузок канала. Публикуют schedule, ручной запуск
        # и пуши с пометкой [publish] в сообщении коммита.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish]')
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          docker run --rm -v "$PWD/output:/app/output" \
            -e YT_CLIENT_ID -e YT_CLIENT_SECRET -e YT_REFRESH_TOKEN \
            shorts-factory python -c "
          import json, glob, os
          from shorts_factory import youtube
          metas = glob.glob('/app/output/meta.json') + glob.glob('/app/output/*/meta.json')
          if not metas:
              raise SystemExit('meta.json не найден')
          meta_path = max(metas, key=os.path.getmtime)
          with open(meta_path, encoding='utf-8') as f:
              meta = json.load(f)
          print(json.dumps(youtube.publish(meta), ensure_ascii=False))
          "

      - name: Сохранение видео
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            output/short.mp4
            output/meta.json
            output/*/short.mp4
            output/*/meta.json
          retention-days: 14
          if-no-files-found: error
