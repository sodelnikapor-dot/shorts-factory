name: shorts-catchup

# ВРЕМЕННЫЙ workflow: два внеочередных выпуска после сброса дневного лимита
# загрузок YouTube (~08:00 UTC = 11:00 МСК). Первые попытки 15 Nov в 08:20/09:20 UTC
# упали на сбое edge-tts ("No audio was received"), перезапланированы ниже.
# Кроны сработают только 15 ноября 2026. После выпуска пары этот файл нужно удалить.

on:
  schedule:
    - cron: "30 12 15 11 *"
    - cron: "30 13 15 11 *"

permissions:
  contents: read

concurrency:
  group: shorts-catchup
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа
        run: docker build -t shorts-factory .

      - name: Генерация шортса
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: |
          mkdir -p output
          # Слот 5 или 6 — внеочередные сценарии, не пересекаются с
          # плановыми слотами 0-4 ротации этого дня.
          SLOT=${{ github.event.schedule == '30 12 15 11 *' && 5 || 6 }}
          docker run --rm -v "$PWD/output:/app/output" \
            -v "$PWD/patches/script_gen.py:/app/shorts_factory/script_gen.py" \
            -v "$PWD/patches/images.py:/app/shorts_factory/images.py" \
            -v "$PWD/patches/tts.py:/app/shorts_factory/tts.py" \
            -v "$PWD/patches/video.py:/app/shorts_factory/video.py" \
            -e GEMINI_API_KEY -e POLLINATIONS_TOKEN -e SHORTS_SLOT=$SLOT \
            shorts-factory python -m shorts_factory.pipeline /app/output
        shell: bash

      - name: Публикация на YouTube (если ключи настроены)
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          docker run --rm -v "$PWD/output:/app/output" \
            -e YT_CLIENT_ID -e YT_CLIENT_SECRET -e YT_REFRESH_TOKEN \
            shorts-factory python -c "
          import json, glob, os
          from shorts_factory import youtube
          metas = glob.glob('/app/output/meta.json') + glob.glob('/app/output/*/meta.json')
          if not metas:
              raise SystemExit('meta.json не найден')
          meta_path = max(metas, key=os.path.getmtime)
          with open(meta_path, encoding='utf-8') as f:
              meta = json.load(f)
          print(json.dumps(youtube.publish(meta), ensure_ascii=False))
          "

      - name: Сохранение видео
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-catchup-${{ github.run_id }}
          path: |
            output/short.mp4
            output/meta.json
            output/*/short.mp4
            output/*/meta.json
          retention-days: 14
          if-no-files-found: error
